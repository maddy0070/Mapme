name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Temporary. The authoring environment has no route to Maven Central or to a
  # tile host, so the two facts this sprint depends on — which MapLibre
  # versions exist, and what the tile schema actually contains — can only be
  # established from a runner. Deleted once they are.
  probe:
    name: Probe the map stack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: MapLibre Android versions on Maven Central
        run: |
          curl -sS --fail-with-body \
            https://repo1.maven.org/maven2/org/maplibre/gl/android-sdk/maven-metadata.xml \
            | tr '<' '\n' | grep -E '^(version|latest|release)>' | tail -30 || echo "FAILED"

      - name: MapLibre annotation plugin versions
        run: |
          curl -sS --fail-with-body \
            https://repo1.maven.org/maven2/org/maplibre/gl/android-plugin-annotation-v9/maven-metadata.xml \
            | tr '<' '\n' | grep -E '^(version|latest|release)>' | tail -12 || echo "FAILED"

      - name: OpenFreeMap TileJSON — the schema a style has to target
        run: |
          curl -sS --fail-with-body https://tiles.openfreemap.org/planet > tilejson.json || echo "FAILED"
          echo "--- bytes: $(wc -c < tilejson.json)"
          python3 - <<'EOF'
          import json
          d = json.load(open('tilejson.json'))
          print("tiles:", d.get("tiles"))
          print("minzoom/maxzoom:", d.get("minzoom"), d.get("maxzoom"))
          for L in d.get("vector_layers", []):
              print(f"  {L['id']:22} z{L.get('minzoom')}-{L.get('maxzoom')}  "
                    f"fields={sorted(L.get('fields', {}).keys())[:9]}")
          EOF

      - name: Protomaps basemap build — the self-hosted alternative
        run: |
          curl -sS -o /dev/null -w "protomaps demo tiles: %{http_code}\n" \
            "https://demo-bucket.protomaps.com/v4.pmtiles" || echo "FAILED"

  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Best effort: the task swallows network failures and the app falls back
      # to the platform typeface. It runs first so the assembled APK carries
      # the real brand faces whenever the runner can reach Google Fonts.
      - name: Fetch brand typefaces
        timeout-minutes: 15
        run: ./gradlew fetchBrandFonts

      # The fetch task swallows network errors on purpose so an offline
      # developer still gets a working build on the fallback typeface. That is
      # the right behaviour locally and the wrong one here: on a runner that
      # can reach Google Fonts, a missing file means a bad URL, and without
      # this check the APK would ship looking like a different product with
      # nothing in the log to say why.
      - name: Verify the brand typefaces actually landed
        run: |
          dir=core/design/src/main/assets/fonts
          for f in BricolageGrotesque.ttf PlusJakartaSans.ttf; do
            if [ ! -s "$dir/$f" ]; then
              echo "::error::$f is missing — the app would fall back to the platform typeface."
              exit 1
            fi
            size=$(wc -c < "$dir/$f")
            if [ "$size" -lt 20000 ]; then
              echo "::error::$dir/$f is only $size bytes; that is not a font."
              exit 1
            fi
            echo "$f: $size bytes"
          done

      - name: Unit tests
        run: ./gradlew test

      # Every sprint has to produce something installable. This is that thing.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapme-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Android Lint
        run: ./gradlew lint

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
