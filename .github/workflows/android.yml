name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Best effort: the task swallows network failures and the app falls back
      # to the platform typeface. It runs first so the assembled APK carries
      # the real brand faces whenever the runner can reach Google Fonts.
      - name: Fetch brand typefaces
        timeout-minutes: 15
        run: ./gradlew fetchBrandFonts

      - name: Unit tests
        run: ./gradlew test

      # Every sprint has to produce something installable. This is that thing.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapme-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Android Lint
        run: ./gradlew lint

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
